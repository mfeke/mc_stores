<div class="container menu over py-3 ">
    <div class=" link " *ngFor="let category of categories; let i = index">

        <p class="bold mb-0 w-100" [class.bold]="0 === i">{{category.name | uppercase}}</p>
    </div>
</div>

            </svg>

        </div>
        <p class="product-title mb-0">FILTER & SORT</p>
    </div>
</div>

<div class="grid-container  py-3" [ngClass]="{'grid-one':col === 'col-12', 'grid-container ': col === 'col-2'|| !col, 'grid-four':col  === 'col-4'}">
    <div class="text-black mb-3" *ngFor="let item of products;">

        <div class="bg-sec mb-3 p-2 w-100">
            <div class="con" *ngFor="let image of item.images;let i = index">
                <img [src]="image" *ngIf="i === 0" alt class="w-100">
            </div>
        </div>
        <div class="container" *ngIf="col !== 'col-4'">
            <p class=" product-title mb-1">
                {{item.name}}
            <p>
            <p class="span product-price">{{item.price|currency:' '}} ZAR</p>
            <div class="d-flex">
                <div class="con me-2" *ngFor="let color of item.stock | unique :'colour'" >
                    <div class=" p-2" [style.background]="color.colour| lowercase "></div>
                </div>
            </div>
        </div>

    </div>
</div>
