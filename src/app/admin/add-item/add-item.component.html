{{message}}
<div class="container py-3 bg-light">
    <h6 class="mb-3">PRODUCT INFORMATION</h6>
    <div class="contain">
        <div class="contai py-3" *ngIf="selectedFiles.length ===  0">

            <label for="image-input"
                class="border img-d bg-white w-100 d-flex align-items-center justify-content-center upload p-3 custom-file-upload">

                <div class="contain   w-100">
                    <div class="d-flex justify-content-center align-item-center mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-center" width="1.5em" height="1.5em"
                            viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="1.5">
                                <path
                                    d="M22 7.5v8c0 2.828 0 4.242-.879 5.12c-.878.88-2.293.88-5.121.88H8c-2.828 0-4.243 0-5.121-.88C2 19.743 2 18.329 2 15.5V13c0-2.829 0-4.243.879-5.122C3.757 7 5.172 7 8 7h.4c.626 0 .94 0 1.226-.088a2 2 0 0 0 .539-.259c.248-.169.444-.413.835-.903c.391-.489.587-.733.835-.903a2 2 0 0 1 .539-.258A2.3 2.3 0 0 1 13 4.5m3 .5h5m-2.5 2.5v-5M5 10h2" />
                                <path d="M18.53 14a4 4 0 1 1-8 0a4 4 0 0 1 8 0" />
                            </g>
                        </svg>
                    </div>

                    <p class="bild text-center">ADD PHOTOS OR VIDEOS</p>

                </div>
            </label>

            <input id="image-input" type="file" accept="image/*" multiple (change)="onFilesSelected($event)"
                #fileInput />
        </div>
        <div class="preview-grid " *ngIf="imagePreviews.length > 0">
            <div *ngFor="let src of imagePreviews; let i = index" class="preview-card">
                <div class="bg-url my-3 bg-dark w-100 rounded" [style.background-image]="'url(' + src + ')'"
                    *ngIf="i === 0">
                    <button type="button" class="remove-btn btn text-danger" (click)="removeImage(i)">&times;</button>
                </div>
            </div>

            <div class="d-flex mb-3">
                <div class="co" (click)="isSelectedImage(i)" [ngClass]="{'col-3': i !== 0 && i < 4}"
                    *ngFor="let src of imagePreviews; let i = index">

                    <div class="bg-small rounded" [style.background-image]="'url(' + src + ')'"
                        *ngIf="i !== 0 && i < 4 ">
                        <div class="bg-b rounded d-flex align-items-center justify-content-center w-100 h-100"
                            (click)="removeImage(i)" *ngIf="selectedImage === i">
                            <button type="button" class="btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                                    class="bi text-danger bi-trash3" viewBox="0 0 16 16">
                                    <path
                                        d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-3">
                    <div
                        class="bg-small d-flex justify-content-center align-items-center text-secondary rounded border">
                        <label for="image-input">

                            <svg xmlns="http://www.w3.org/2000/svg" class="text-center" width="1.5em" height="1.5em"
                                viewBox="0 0 24 24">
                                <path d="M0 0h24v24H0z" fill="none" />
                                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.5">
                                    <path
                                        d="M22 7.5v8c0 2.828 0 4.242-.879 5.12c-.878.88-2.293.88-5.121.88H8c-2.828 0-4.243 0-5.121-.88C2 19.743 2 18.329 2 15.5V13c0-2.829 0-4.243.879-5.122C3.757 7 5.172 7 8 7h.4c.626 0 .94 0 1.226-.088a2 2 0 0 0 .539-.259c.248-.169.444-.413.835-.903c.391-.489.587-.733.835-.903a2 2 0 0 1 .539-.258A2.3 2.3 0 0 1 13 4.5m3 .5h5m-2.5 2.5v-5M5 10h2" />
                                    <path d="M18.53 14a4 4 0 1 1-8 0a4 4 0 0 1 8 0" />
                                </g>
                            </svg>
                        </label>
                        <input id="image-input" type="file" accept="image/*" multiple (change)="onFilesSelected($event)"
                            #fileInput />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="form-floating mb-3">
        <input type="text" class="form-control input" id="floatingInputTitle" [(ngModel)]="product.name"
            placeholder="Blacmo">
        <label for="floatingInputTitle">NAME OF PRODUCT<span class="text-danger">*</span></label>
    </div>
    <quill-editor class="rounded bg-white mb-3" [formControl]="editorControl" theme="snow"
        placeholder="ENTER THE PRODUCT DETAILS...">
    </quill-editor>
    <div class="form-floating mb-3">
        <textarea class="form-control"[(ngModel)]="product.material"  placeholder="Leave a comment here" id="floatingTextarea"></textarea>
        <label for="floatingTextarea">MATERIAL</label>
    </div>
    <div class="border  p-3   mb-3 form-control input" data-bs-toggle="offcanvas"
        [ngClass]="{'px-2 py-1 ': selectedCategory.length > 0, 'd-flex align-items-center  a': selectedCategory.length === 0}"
        data-bs-target="#offcanvasBottom" aria-controls="offcanvasBottom">
        <svg *ngIf="selectedCategory.length === 0" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
            fill="currentColor" class="bi bi-plus-circle-fill" viewBox="0 0 16 16">
            <path
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z" />
        </svg>

        <div class="xon">
            <label class="mb-0 ms-2" [ngClass]="{'font-category text-secondary' : selectedCategory.length>0}"
                for="floatingInputSale">ADD CATEGORY</label>


        </div>

        <button type="button" *ngFor="let category of selectedCategory" class="btn border mb-2 me-2">
            <div class="d-flex align-items-center">
                <span class="mb-0 me-1 font-category">{{category.name | uppercase}}</span>

                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-x"
                    viewBox="0 0 16 16">
                    <path
                        d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
                </svg>
            </div>

        </button>
    </div>
</div>
<div class="bg-light mt-3 container py-3 s">

    <div class="d-flex align-items-center mb-3 justify-content-between">
        <h6>PRODUCT VARIANTS</h6>
        <span class="bg-info btn span-f text-white" data-bs-toggle="modal" data-bs-target="#staticBackdrop">+ ADD
            VARIANT </span>
    </div>
    <div class="over" *ngIf="variantList.length !== 0">
        <table class="table  table-striped-columns ">
            <thead class="table-dark">
                <tr>
                    <th class="th" scope="col">VARIANT</th>
                    <th class="th" scope="col">PRICE</th>
                    <th class="th" scope="col">QUANTIT</th>
                </tr>
            </thead>
            <tbody>
                @for (variant of variantList; track $index) {
                <tr>
                    <td>
                        <div class="d-flex">
                            <div class="con" *ngFor="let item of variant | keyvalue; let i= index">
                                <span class="text" *ngIf="i === 0">{{item.value}} </span>
                                <span class="text" *ngIf="i > 0">/ {{item.value}}</span>
                            </div>
                        </div>

                    </td>
                    <td>
                        <input class="form-control" [(ngModel)]="variant.price" type="text" placeholder="0.00">
                    </td>
                    <td>
                        <input class="form-control" [(ngModel)]="variant.qty" type="text" placeholder="0">
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
<div class="bg-light py-3">

</div>
<div class="bg-light container py-3 mt-3">
    <h6>PRICING</h6>

    <div class="form-floating mb-3">
        <input type="number" class="form-control input" id="floatingInputPrice" [(ngModel)]="product.price"
            placeholder="3000">
        <label for="floatingInputPrice">PRICE<span class="text-danger">*</span></label>
    </div>
    <div class="form-floating mb-3">
        <input type="number" class="form-control input " id="floatingInputSale" [(ngModel)]=" product.priceSale "
            placeholder="1000">
        <label for="floatingInputSale">SALE PRICE</label>
    </div>
</div>

<!-- Category model-->
<div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasBottom" aria-labelledby="offcanvasBottomLabel">
    <div class="offcanvas-header border-bottom ">
        <h6 class="offcanvas-title" id="offcanvasBottomLabel">CATEGORY</h6>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body small">

        <div class="con">
            <button type="button" *ngFor="let category of categoryList" class="btn border mb-2 me-2"
                (click)="isSelectedCategory(category) " [ngClass]="{'btn-dark':category.value}">
                <div class="d-flex align-items-center">
                    <span class="mb-0 me-1 font-category">{{category.name | uppercase}}</span>
                    <svg *ngIf="!category.value" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                        <path
                            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                    </svg>
                    <svg *ngIf="category.value" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
                        <path
                            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
                    </svg>
                </div>

            </button>
        </div>

    </div>
    <div class="border-top container py-2">
        <div class="row">
            <div class="col-6">
                <button type="button" data-bs-dismiss="offcanvas" class="btn border w-100">
                    CANCEL
                </button>
            </div>
            <div class="col-6">
                <button type="button" data-bs-dismiss="offcanvas" class="btn btn-primary w-100"
                    (click)="isSaveCategory()">
                    SAVE
                </button>
            </div>
        </div>
    </div>
</div>


<!--variant modal-->
<div class="modal fade " id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-none">

            <div class="modal-body bg-white rounded">
                <h6>ADD VARIANT </h6>
                <div class="form-floating mb-3">
                    <input type="text" [(ngModel)]="variantData.option" class="form-control" #option
                        id="floatingInputOpt" placeholder="colour ">
                    <label for="floatingInputOpt">OPTION</label>
                </div>
                <div class="form-floating">
                    <input type="text" [(ngModel)]="variantData.value" class="form-control" #value id="floatingVale"
                        placeholder="value">
                    <label for="floatingVale">VALUE</label>
                </div>
                <button type="button" class="btn w-100 mt-3 btn-primary"
                    (click)="isSubmit(option.value, value.value)">SUBMIT</button>
            </div>
            <div class="d-flex justify-content-center">

                <div class="text bg-white rounded-circle mt-3" data-bs-dismiss="modal">

                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi m-2 bi-x" viewBox="0 0 16 16">
                        <path
                            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
                    </svg>
                </div>
            </div>
        </div>
    </div>


</div>
